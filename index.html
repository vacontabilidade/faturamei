<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaturaMEI v1.0.0</title>
    <script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-900: #111827;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f3f4f6;
            color: var(--gray-900);
        }
        .screen { display: none; }
        .screen.active { display: flex; }
        
        #loginScreen {
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--gray-700);
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            background: var(--primary);
            color: white;
            margin-top: 10px;
        }
        .btn:hover {
            background: var(--primary-dark);
        }
        .error {
            color: red;
            font-size: 12px;
            margin-top: 5px;
        }
        
        #appScreen {
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            background: white;
            border-bottom: 1px solid var(--gray-200);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar { width: 200px; background: white; border-right: 1px solid var(--gray-200); padding: 20px; }
        .nav-item { width: 100%; padding: 12px; border: none; text-align: left; margin-bottom: 10px; cursor: pointer; background: var(--gray-100); border-radius: 6px; }
        .nav-item.active { background: var(--primary); color: white; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .data-table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; }
        .data-table th { background: var(--gray-50); padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--gray-200); }
        .data-table td { padding: 12px; border-bottom: 1px solid var(--gray-200); }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="loginScreen" class="screen active">
        <div class="login-card">
            <div class="login-header">
                <h1>📊 FaturaMEI</h1>
                <p>Sistema de Gestão MEI</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="admin@dspgroup.com.br">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="password" required placeholder="123456">
                </div>
                <button type="submit" class="btn">Entrar</button>
                <div id="loginError" class="error"></div>
            </form>
        </div>
    </div>

    <!-- APP -->
    <div id="appScreen" class="screen">
        <div class="header">
            <h2>FaturaMEI</h2>
            <button class="btn" style="width: auto;" onclick="logout()">Sair</button>
        </div>
        <div style="display: flex; flex: 1;">
            <div class="sidebar">
                <button class="nav-item active" onclick="mudarAba('dashboard')">📊 Dashboard</button>
                <button class="nav-item" onclick="mudarAba('clientes')">👥 Clientes</button>
                <button class="nav-item" onclick="mudarAba('notas')">📄 Notas</button>
            </div>
            <div class="main-content">
                <section id="dashboard" class="tab-content active">
                    <h1>Dashboard</h1>
                    <p id="userInfo">Carregando...</p>
                    <table class="data-table" style="margin-top: 20px;">
                        <thead>
                            <tr>
                                <th>Métrica</th>
                                <th>Valor</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Total de Clientes</td>
                                <td id="totalClientes">0</td>
                            </tr>
                            <tr>
                                <td>Total de Notas</td>
                                <td id="totalNotas">0</td>
                            </tr>
                        </tbody>
                    </table>
                </section>

                <section id="clientes" class="tab-content">
                    <h1>Clientes</h1>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>CPF/CNPJ</th>
                                <th>Tipo</th>
                            </tr>
                        </thead>
                        <tbody id="clientesBody">
                            <tr><td colspan="3">Carregando...</td></tr>
                        </tbody>
                    </table>
                </section>

                <section id="notas" class="tab-content">
                    <h1>Notas Fiscais</h1>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>NF</th>
                                <th>Cliente</th>
                                <th>Valor</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="notasBody">
                            <tr><td colspan="4">Carregando...</td></tr>
                        </tbody>
                    </table>
                </section>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://abihuiwlpvdnzwpomxni.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_BhqlXANE241wIn9QSUoogg_MnGMZxX7';

        let supabase = null;
        let usuarioLogado = null;

        // Esperar Supabase carregar
        function aguardarSupabase() {
            if (!window.supabase) {
                setTimeout(aguardarSupabase, 100);
                return;
            }

            const { createClient } = window.supabase;
            supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            verificarSessao();
        }

        async function verificarSessao() {
            try {
                const { data } = await supabase.auth.getSession();
                if (data.session) {
                    usuarioLogado = data.session.user;
                    mostrarApp();
                    carregarDados();
                } else {
                    mostrarLogin();
                }
            } catch (err) {
                console.error('Erro ao verificar sessão:', err);
                mostrarLogin();
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    errorDiv.textContent = 'Email ou senha incorretos';
                    return;
                }

                usuarioLogado = data.user;
                mostrarApp();
                carregarDados();
            } catch (err) {
                errorDiv.textContent = 'Erro ao fazer login: ' + err.message;
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            usuarioLogado = null;
            mostrarLogin();
        }

        function mostrarLogin() {
            document.getElementById('loginScreen').classList.add('active');
            document.getElementById('appScreen').classList.remove('active');
        }

        function mostrarApp() {
            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('appScreen').classList.add('active');
        }

        function mudarAba(aba) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(aba).classList.add('active');
            event.target.classList.add('active');
        }

        async function carregarDados() {
            carregarMetricas();
            carregarClientes();
            carregarNotas();
        }

        async function carregarMetricas() {
            try {
                const { count: totalClientes } = await supabase.from('clientes').select('*', { count: 'exact', head: true });
                const { count: totalNotas } = await supabase.from('notas_fiscais').select('*', { count: 'exact', head: true });

                document.getElementById('totalClientes').textContent = totalClientes || 0;
                document.getElementById('totalNotas').textContent = totalNotas || 0;
                document.getElementById('userInfo').textContent = `Logado como: ${usuarioLogado.email}`;
            } catch (err) {
                console.error('Erro ao carregar métricas:', err);
            }
        }

        async function carregarClientes() {
            try {
                const { data } = await supabase.from('clientes').select('*').limit(10);
                const tbody = document.getElementById('clientesBody');

                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3">Nenhum cliente</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(c => `
                    <tr>
                        <td>${c.nome}</td>
                        <td>${c.cpf_cnpj}</td>
                        <td>${c.tipo}</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Erro ao carregar clientes:', err);
            }
        }

        async function carregarNotas() {
            try {
                const { data } = await supabase.from('notas_fiscais').select('*').limit(10);
                const tbody = document.getElementById('notasBody');

                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">Nenhuma nota</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(n => `
                    <tr>
                        <td>${n.numero_nf}</td>
                        <td>-</td>
                        <td>R$ ${n.valor}</td>
                        <td>${n.status}</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Erro ao carregar notas:', err);
            }
        }

        // Iniciar
        window.addEventListener('load', aguardarSupabase);
    </script>
</body>
</html>
